<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>金灶桑旅 · 五站二维码导览牌</title><style>body{margin:30px;background:#F7F4ED;color:#512567;font-family:-apple-system,"PingFang SC",sans-serif}h1{text-align:center;font-size:26px}p{text-align:center;font-size:12px;color:#8a7994;line-height:1.8}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:22px;max-width:800px;margin:35px auto}.card{border:1px solid #d4c3df;border-radius:24px;background:#fffdf9;padding:30px;text-align:center;break-inside:avoid}.card>span{font-size:10px;letter-spacing:3px}.card h2{font-size:23px;margin:14px 0 10px}.card img{width:155px;height:155px}.card .ip{height:60px;width:60px;object-fit:contain;display:block;margin:0 auto;mix-blend-mode:multiply}button{display:block;margin:20px auto;border:0;background:#512567;color:white;border-radius:10px;padding:12px 20px;cursor:pointer}@media print{body{margin:15px;background:white}.card{padding:20px}.card img{width:120px;height:120px}button{display:none}.grid{gap:15px;margin:20px auto}}</style></head><body><h1>跟着灶灶桑，收集一路的发现</h1><p>导览牌原型 · 微信扫码页面支持识别 · 节点安装位置需实际果园踏勘确认</p><button onclick="print()">打印五站导览牌</button><div class="grid" id="cards"></div><script src="core.js"></script><script>document.getElementById('cards').innerHTML=Sanglv.nodes.map(n=>`<section class="card"><img class="ip" src="assets/zaozao-source.png" alt="灶灶桑"><span>EXPLORE THE ORCHARD · ${n.id}</span><h2>${n.name}</h2><p>${n.subtitle}</p><img src="assets/qr-${n.id}.png" alt="${n.id}节点二维码"><p>在小程序「扫码探索」中扫一扫<br>sanglv:${n.id}</p></section>`).join('')</script></body></html>
